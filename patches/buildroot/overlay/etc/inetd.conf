# WHY2025: SSH — inetd vfork+execs dropbear per connection (the NOMMU
# dropbear build is inetd-mode only; its standalone accept loop needs
# fork()). -R generates the ed25519 host key on first connection; no -B,
# so the blank root password can NOT be used over SSH — use an
# authorized_keys on the SD card (see /etc/init.d/S85dropbear).
22 stream tcp nowait root /usr/sbin/dropbear dropbear -i -R
